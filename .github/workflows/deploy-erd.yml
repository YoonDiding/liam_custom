# QESG ERD — schemas/ 또는 커스텀 코드 갱신 시 이 포크의 CLI(영역 그룹 커스텀 포함)로
# 빌드해 GitHub Pages로 배포한다.
name: Deploy ERD to Pages
on:
  push:
    branches: [main]
    paths:
      - "schemas/**"
      - "frontend/**"
      - ".github/workflows/deploy-erd.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo build --filter=@liam-hq/cli
      - run: node frontend/packages/cli/dist-cli/bin/cli.js erd build --input schemas/qesg_schema.sql --format postgres
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
